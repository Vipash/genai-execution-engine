services:
  postgres:
    image: pgvector/pgvector:pg16
    platform: linux/amd64
    container_name: genai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: genai_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d genai_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: genai_redis
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/genai_engine
      REDIS_URL: redis://redis:6379/0
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    container_name: genai_api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/genai_engine
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python run_worker.py
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/genai_engine
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata: